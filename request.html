<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOEN 飲みの希望を出す</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--pink:#FF3CAC;--purple:#784BFF;--cyan:#00F5FF;--grad:linear-gradient(135deg,#FF3CAC,#784BFF,#00F5FF);--bg:#080808;--bg2:#0F0F0F;--text:#F0F0F0;--muted:#666;--border:rgba(255,255,255,0.09);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh;padding:0 0 100px;}
  .header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;}
  .logo{font-size:22px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .content{padding:28px 20px;}
  .page-title{font-size:22px;font-weight:900;margin-bottom:6px;}
  .page-desc{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.7;}
  .form-group{margin-bottom:24px;}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase;}
  input,select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;outline:none;transition:border-color .2s;}
  input:focus,select:focus{border-color:var(--pink);}
  select option{background:var(--bg2);}
  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--bg2);border:1px solid var(--border);border-radius:100px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
  .chip.selected{border-color:var(--pink);background:rgba(255,60,172,.1);color:var(--pink);}
  .num-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .num-btn{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .2s;font-weight:700;}
  .num-btn.selected{border-color:var(--pink);background:rgba(255,60,172,.1);color:var(--pink);}
  .age-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;}
  .age-sep{text-align:center;color:var(--muted);}
  textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;outline:none;resize:none;height:90px;transition:border-color .2s;}
  textarea:focus{border-color:var(--pink);}
  .preview-card{background:var(--bg2);border:1px solid rgba(255,60,172,.2);border-radius:16px;padding:20px;margin-bottom:24px;}
  .preview-title{font-size:13px;color:var(--pink);font-weight:700;margin-bottom:14px;letter-spacing:.06em;}
  .preview-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;}
  .preview-key{color:var(--muted);}
  .preview-val{font-weight:700;}
  .bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:16px 20px;background:var(--bg);border-top:1px solid var(--border);}
  .btn-submit{width:100%;background:var(--grad);color:#fff;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:17px;padding:16px;border-radius:100px;border:none;cursor:pointer;transition:opacity .2s;box-shadow:0 0 30px rgba(255,60,172,.25);}
  .btn-submit:hover{opacity:.88;}
  .success-wrap{text-align:center;padding:80px 20px;}
  .success-icon{font-size:64px;margin-bottom:20px;}
  .success-title{font-size:24px;font-weight:900;margin-bottom:12px;}
  .success-desc{font-size:14px;color:var(--muted);line-height:1.8;}
  .section-divider{height:1px;background:var(--border);margin:32px 0;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">GOEN</div>
  <span style="font-size:14px;color:var(--muted);">飲みの希望を出す</span>
</div>

<div id="formView">
<div class="content">
  <div class="page-title">🍺 今夜の条件を入力</div>
  <div class="page-desc">マッチング後、LINEでご連絡します。</div>

  <!-- エリア -->
  <div class="form-group">
    <label>エリア</label>
    <div class="chip-group" id="areaGroup">
      <div class="chip" onclick="selectChip(this,'area','恵比寿')">恵比寿</div>
      <div class="chip" onclick="selectChip(this,'area','渋谷')">渋谷</div>
      <div class="chip" onclick="selectChip(this,'area','新宿')">新宿</div>
      <div class="chip" onclick="selectChip(this,'area','六本木')">六本木</div>
      <div class="chip" onclick="selectChip(this,'area','上野')">上野</div>
      <div class="chip" onclick="selectChip(this,'area','その他')">その他</div>
    </div>
  </div>

  <!-- 希望日 -->
  <div class="form-group">
    <label>希望日</label>
    <input type="date" id="meetDate">
  </div>

  <!-- 希望時間 -->
  <div class="form-group">
    <label>合流希望時間</label>
    <div class="chip-group" id="timeGroup">
      <div class="chip" onclick="selectChip(this,'meetTime','18:00〜')">18時〜</div>
      <div class="chip" onclick="selectChip(this,'meetTime','19:00〜')">19時〜</div>
      <div class="chip" onclick="selectChip(this,'meetTime','20:00〜')">20時〜</div>
      <div class="chip" onclick="selectChip(this,'meetTime','21:00〜')">21時〜</div>
      <div class="chip" onclick="selectChip(this,'meetTime','22:00〜')">22時〜</div>
    </div>
  </div>

  <!-- 参加人数 -->
  <div class="form-group">
    <label>参加人数（自分含む）</label>
    <div class="num-grid">
      <div class="num-btn" onclick="selectNum(this,1)">1人</div>
      <div class="num-btn" onclick="selectNum(this,2)">2人</div>
      <div class="num-btn" onclick="selectNum(this,3)">3人</div>
      <div class="num-btn" onclick="selectNum(this,4)">4人〜</div>
    </div>
  </div>

  <!-- 雰囲気 -->
  <div class="form-group">
    <label>雰囲気</label>
    <div class="chip-group" id="vibeGroup">
      <div class="chip" onclick="selectChip(this,'vibe','ワイワイ')">🎉 ワイワイ</div>
      <div class="chip" onclick="selectChip(this,'vibe','落ち着き')">🍷 落ち着き</div>
      <div class="chip" onclick="selectChip(this,'vibe','どちらでも')">🍺 どちらでも</div>
    </div>
  </div>

  <div class="section-divider"></div>

  <!-- 相手の希望年齢 -->
  <div class="form-group">
    <label>相手の希望年齢（任意）</label>
    <div class="age-row">
      <input type="number" id="ageMin" placeholder="20" min="18" max="60">
      <div class="age-sep">〜</div>
      <input type="number" id="ageMax" placeholder="35" min="18" max="60">
    </div>
  </div>

  <!-- 一言 -->
  <div class="form-group">
    <label>一言メッセージ（任意）</label>
    <textarea id="message" placeholder="例: 仕事終わりにサクッと飲みたいです！雰囲気いい感じで◎"></textarea>
  </div>

  <!-- プレビュー -->
  <div class="preview-card" id="previewCard" style="display:none">
    <div class="preview-title">📋 募集プレビュー</div>
    <div class="preview-row"><span class="preview-key">エリア</span><span class="preview-val" id="pArea">-</span></div>
    <div class="preview-row"><span class="preview-key">日時</span><span class="preview-val" id="pTime">-</span></div>
    <div class="preview-row"><span class="preview-key">人数</span><span class="preview-val" id="pNum">-</span></div>
    <div class="preview-row"><span class="preview-key">雰囲気</span><span class="preview-val" id="pVibe">-</span></div>
  </div>
</div>
</div>

<!-- 完了 -->
<div id="successView" style="display:none">
  <div class="success-wrap">
    <div class="success-icon">🍻</div>
    <div class="success-title">希望を受け付けました！</div>
    <div class="success-desc">マッチングが成立次第、<br>LINEでご連絡します。<br><br>当日のマッチングをお楽しみに！</div>
  </div>
</div>

<div class="bottom-bar" id="bottomBar">
  <button class="btn-submit" onclick="submit()">この条件で希望を出す 🍺</button>
</div>

<script>
const uid = new URLSearchParams(location.search).get('uid');
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
const state = { area:null, meetDate:'', meetTime:null, numPeople:null, vibe:null, ageMin:'', ageMax:'', message:'' };

// 今日の日付をデフォルトに
document.getElementById('meetDate').value = new Date().toISOString().split('T')[0];
document.getElementById('meetDate').min   = new Date().toISOString().split('T')[0];

function selectChip(el, field, value) {
  el.closest('.chip-group').querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  state[field] = value;
  updatePreview();
}

function selectNum(el, value) {
  document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  state.numPeople = value;
  updatePreview();
}

function updatePreview() {
  const date = document.getElementById('meetDate').value;
  if (state.area && date && state.meetTime && state.numPeople && state.vibe) {
    document.getElementById('previewCard').style.display = '';
    document.getElementById('pArea').textContent = state.area;
    document.getElementById('pTime').textContent = date + ' ' + state.meetTime;
    document.getElementById('pNum').textContent  = state.numPeople + '人';
    document.getElementById('pVibe').textContent = state.vibe;
  }
}

document.getElementById('meetDate').addEventListener('change', updatePreview);

async function submit() {
  state.meetDate = document.getElementById('meetDate').value;
  state.ageMin   = document.getElementById('ageMin').value;
  state.ageMax   = document.getElementById('ageMax').value;
  state.message  = document.getElementById('message').value;

  if (!state.area)      { alert('エリアを選択してください'); return; }
  if (!state.meetDate)  { alert('希望日を選択してください'); return; }
  if (!state.meetTime)  { alert('合流時間を選択してください'); return; }
  if (!state.numPeople) { alert('参加人数を選択してください'); return; }
  if (!state.vibe)      { alert('雰囲気を選択してください'); return; }

  // ユーザーID取得
  const userRes = await fetch(SUPABASE_URL + '/rest/v1/users?line_user_id=eq.' + uid + '&select=id', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  const users = await userRes.json();
  if (!users.length) { alert('ユーザー情報が見つかりません'); return; }

  const expires = new Date(state.meetDate);
  expires.setHours(23, 59, 59);

  await fetch(SUPABASE_URL + '/rest/v1/requests', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({
      user_id: users[0].id, area: state.area, meet_date: state.meetDate,
      meet_time: state.meetTime, num_people: state.numPeople, vibe: state.vibe,
      partner_age_min: state.ageMin ? parseInt(state.ageMin) : null,
      partner_age_max: state.ageMax ? parseInt(state.ageMax) : null,
      message: state.message, expires_at: expires.toISOString(),
    })
  });

  document.getElementById('formView').style.display = 'none';
  document.getElementById('successView').style.display = '';
  document.getElementById('bottomBar').style.display = 'none';
}
</script>
</body>
</html>
