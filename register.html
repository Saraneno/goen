<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOEN 新規登録</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pink:#FF3CAC; --purple:#784BFF; --cyan:#00F5FF;
    --grad:linear-gradient(135deg,#FF3CAC,#784BFF,#00F5FF);
    --bg:#0D0A1A; --card:rgba(255,255,255,0.05);
    --text:#F0F0F0; --muted:#888; --border:rgba(255,255,255,0.1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;min-height:100vh;padding-bottom:100px;}

  /* 背景グラデーション */
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(120,75,255,0.2) 0%,transparent 60%),radial-gradient(ellipse at bottom right,rgba(255,60,172,0.15) 0%,transparent 60%);pointer-events:none;z-index:0;}

  /* HEADER */
  .header{position:sticky;top:0;z-index:10;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,10,26,0.9);backdrop-filter:blur(12px);}
  .header-left{display:flex;align-items:center;gap:10px;}
  .logo-circle{width:38px;height:38px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;}
  .logo-info{}
  .logo-name{font-size:16px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
  .logo-sub{font-size:9px;letter-spacing:0.15em;color:var(--muted);}
  .btn-register{background:var(--grad);color:#fff;font-weight:700;font-size:13px;padding:8px 18px;border-radius:100px;border:none;cursor:pointer;}

  /* CONTENT */
  .content{padding:28px 20px;position:relative;z-index:1;}
  .page-title{font-size:28px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
  .page-desc{font-size:14px;color:var(--muted);margin-bottom:28px;}

  /* CARD */
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:16px;backdrop-filter:blur(8px);}

  /* FORM */
  .field-label{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .field-label span{font-size:11px;color:var(--muted);font-weight:400;}
  .field-label .required{font-size:11px;color:var(--pink);font-weight:700;}
  input[type="text"],input[type="number"],select,textarea{
    width:100%;background:rgba(255,255,255,0.07);border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;color:var(--text);
    font-family:'Zen Kaku Gothic New',sans-serif;font-size:15px;outline:none;
    transition:border-color .2s;-webkit-appearance:none;
  }
  input:focus,select:focus,textarea:focus{border-color:rgba(255,60,172,0.5);}
  input::placeholder,textarea::placeholder{color:var(--muted);}
  select option{background:#1a1030;}
  textarea{resize:none;height:100px;}

  /* TWO COL */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* CHIPS */
  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:100px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text);}
  .chip.selected{border-color:var(--pink);background:rgba(255,60,172,0.12);color:var(--pink);}

  /* UPLOAD */
  .upload-area{border:2px dashed rgba(255,255,255,0.15);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;}
  .upload-area:hover,.upload-area.active{border-color:var(--pink);background:rgba(255,60,172,0.05);}
  .upload-icon{font-size:32px;margin-bottom:10px;}
  .upload-text{font-size:14px;font-weight:700;margin-bottom:4px;}
  .upload-sub{font-size:12px;color:var(--muted);}
  .preview-img{width:100%;border-radius:12px;margin-top:12px;display:none;}

  /* CHAR COUNT */
  .char-count{font-size:11px;color:var(--muted);text-align:right;margin-top:4px;}

  /* SUBMIT */
  .btn-submit{width:100%;background:var(--grad);color:#fff;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:17px;padding:18px;border-radius:100px;border:none;cursor:pointer;transition:opacity .2s;box-shadow:0 0 30px rgba(255,60,172,0.25);margin-top:8px;}
  .btn-submit:hover{opacity:.88;}
  .btn-submit:disabled{opacity:.4;cursor:not-allowed;}

  /* BOTTOM NAV */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,10,26,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 20px;z-index:20;}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px;}
  .nav-icon{font-size:20px;}
  .nav-label{font-size:10px;color:var(--muted);}
  .nav-item.active .nav-label{color:var(--pink);}

  /* SUCCESS */
  .success-wrap{text-align:center;padding:80px 20px;display:none;}
  .success-icon{font-size:64px;margin-bottom:20px;}
  .success-title{font-size:24px;font-weight:900;margin-bottom:12px;}
  .success-desc{font-size:14px;color:var(--muted);line-height:1.8;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-circle">G</div>
    <div class="logo-info">
      <div class="logo-name">GOEN</div>
      <div class="logo-sub">GROUP DRINK</div>
    </div>
  </div>
  <button class="btn-register">新規登録</button>
</div>

<div class="content" id="formContent">
  <div class="page-title">新規登録</div>
  <div class="page-desc">あなたのプロフィールを教えてください</div>

  <!-- ニックネーム -->
  <div class="card">
    <div class="field-label">ニックネーム <span class="required">必須</span></div>
    <input type="text" id="nickname" placeholder="例：Yuki" maxlength="20">
  </div>

  <!-- 性別 -->
  <div class="card">
    <div class="field-label">性別 <span class="required">必須</span></div>
    <div class="chip-group">
      <div class="chip" onclick="selectChip(this,'gender','female')">女性</div>
      <div class="chip" onclick="selectChip(this,'gender','male')">男性</div>
      <div class="chip" onclick="selectChip(this,'gender','other')">その他</div>
    </div>
  </div>

  <!-- 年齢・職業 -->
  <div class="card">
    <div class="two-col">
      <div>
        <div class="field-label">年齢 <span class="required">必須</span></div>
        <input type="number" id="age" placeholder="25" min="18" max="60">
      </div>
      <div>
        <div class="field-label">職業</div>
        <select id="occupation">
          <option value="">選択</option>
          <option>会社員</option>
          <option>フリーランス</option>
          <option>経営者</option>
          <option>公務員</option>
          <option>医療・福祉</option>
          <option>学生</option>
          <option>その他</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 活動エリア -->
  <div class="card">
    <div class="field-label">活動エリア <span class="required">必須</span></div>
    <div class="chip-group">
      <div class="chip" onclick="selectChip(this,'area','渋谷')">渋谷</div>
      <div class="chip" onclick="selectChip(this,'area','新宿')">新宿</div>
      <div class="chip" onclick="selectChip(this,'area','六本木')">六本木</div>
      <div class="chip" onclick="selectChip(this,'area','恵比寿')">恵比寿</div>
      <div class="chip" onclick="selectChip(this,'area','銀座')">銀座</div>
      <div class="chip" onclick="selectChip(this,'area','池袋')">池袋</div>
      <div class="chip" onclick="selectChip(this,'area','横浜')">横浜</div>
    </div>
  </div>

  <!-- 自己紹介 -->
  <div class="card">
    <div class="field-label">自己紹介 <span>任意・最大140字</span></div>
    <textarea id="profileComment" placeholder="美味しいお店巡りが好きです。週末はジャズバーで..." maxlength="140" oninput="updateCharCount(this)"></textarea>
    <div class="char-count"><span id="charCount">0</span>/140</div>
  </div>

  <!-- 本人確認 -->
  <div class="card">
    <div class="field-label">本人確認書類 <span class="required">必須</span></div>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('idFile').click()">
      <div class="upload-icon">⬆️</div>
      <div class="upload-text">運転免許証 / パスポートをアップロード</div>
      <div class="upload-sub">JPG / PNG, 〜10MB</div>
    </div>
    <input type="file" id="idFile" accept="image/*" style="display:none" onchange="previewImage(this)">
    <img id="previewImg" class="preview-img">
  </div>

  <button class="btn-submit" id="submitBtn" onclick="submit()">登録を申請する</button>

  <!-- 成功画面 -->
  <div class="success-wrap" id="successWrap">
    <div class="success-icon">🎉</div>
    <div class="success-title">登録申請完了！</div>
    <div class="success-desc">審査が完了次第、<br>LINEでお知らせします。<br><br>通常24時間以内に審査します。</div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item"><div class="nav-icon">🏠</div><div class="nav-label">ホーム</div></div>
  <div class="nav-item"><div class="nav-icon">✨</div><div class="nav-label">希望</div></div>
  <div class="nav-item active"><div class="nav-icon">👤</div><div class="nav-label">マイ</div></div>
  <div class="nav-item"><div class="nav-icon">🛡</div><div class="nav-label">管理</div></div>
</div>

<script>
const uid = new URLSearchParams(location.search).get('uid');
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
const state = { gender:null, area:null, nickname:'', age:null, occupation:'', profileComment:'', idFileBase64:null };

function selectChip(el, field, value) {
  const group = el.closest('.chip-group');
  group.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  state[field] = value;
}

function updateCharCount(el) {
  state.profileComment = el.value;
  document.getElementById('charCount').textContent = el.value.length;
}

function previewImage(input) {
  if (!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('previewImg');
    img.src = e.target.result;
    img.style.display = 'block';
    document.getElementById('uploadArea').classList.add('active');
    state.idFileBase64 = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}

function validate() {
  if (!document.getElementById('nickname').value) { alert('ニックネームを入力してください'); return false; }
  if (!state.gender)  { alert('性別を選択してください'); return false; }
  const age = parseInt(document.getElementById('age').value);
  if (!age || age < 18) { alert('18歳以上の年齢を入力してください'); return false; }
  if (!state.area)    { alert('活動エリアを選択してください'); return false; }
  if (!state.idFileBase64) { alert('本人確認書類をアップロードしてください'); return false; }
  state.nickname  = document.getElementById('nickname').value;
  state.age       = age;
  state.occupation = document.getElementById('occupation').value;
  return true;
}

async function submit() {
  if (!validate()) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '送信中...';

  if (uid) {
    await fetch(SUPABASE_URL + '/rest/v1/users?line_user_id=eq.' + uid, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        display_name: state.nickname,
        gender: state.gender,
        age: state.age,
        occupation: state.occupation,
        area_pref: state.area,
        profile_comment: state.profileComment,
        verify_method: 'id_photo',
        verify_status: 'pending',
        registration_step: 4,
      })
    });
  }

  document.getElementById('formContent').style.display = 'none';
  document.getElementById('successWrap').style.display = 'block';
  document.getElementById('successWrap').style.display = 'block';
  document.querySelector('.content').appendChild(document.getElementById('successWrap'));
}
</script>
</body>
</html>
